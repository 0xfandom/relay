# Prometheus for local development.
#
# Both Relay processes are scraped, because both export and they export different
# things: the API reports what it does to a request, the dispatcher reports the
# queue and the send path. They are separate targets with separate `instance`
# labels, which is the ordinary shape for a service made of more than one process.
#
# One target each, reached through the host rather than by compose service name, and
# that is deliberate. Relay is run two ways — the full stack from `docker compose up`,
# and `cargo run` on the host when the code is what is changing — and the host address
# is correct for both. Compose publishes 8080 and 9091 to the host, so this address
# reaches the container when the stack is up and the host process when it is not.
#
# Scraping the service names instead would have meant listing both, and both would
# have answered: the published port makes `host.docker.internal:9091` and
# `dispatcher:9091` the same process. Prometheus would have scraped it twice under
# two instance labels and doubled every panel that sums across instances.
#
# Only one of the two can be running at a time regardless — they would collide on the
# port — which is what makes a single target unambiguous.
#
# `host.docker.internal` is resolved by Docker Desktop and, on Linux, by the
# `host-gateway` alias set in the compose file.

global:
  # Fast for a laptop, not for production. The point of a short interval here is
  # that a chaos scenario run by hand — kill a worker, break an endpoint — should
  # show up on the dashboard while you are still looking at it.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: relay-dispatcher
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          component: dispatcher

  - job_name: relay-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          component: api
