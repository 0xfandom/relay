[package]
name = "relay-loadtest"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
relay-dispatcher = { path = "../dispatcher" }
relay-domain = { path = "../domain" }
relay-store = { path = "../store" }
relay-testkit = { path = "../testkit" }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.17"
