[package]
name = "relay-store"
edition.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["clock", "serde"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
# The claim tests spawn competing workers with JoinSet.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
relay-domain = { path = "../domain" }
