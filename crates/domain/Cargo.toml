[package]
name = "relay-domain"
edition.workspace = true
version.workspace = true

# Deliberately empty. Step 1 is yours:
#   cargo add hmac sha2 hex subtle
# Then read WHY each one is here in BRIEF/M1.md.
[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
# Chat transports send a JSON object of their own rather than the customer's bytes.
# Building it is a value-to-value function, so it stays inside this crate's no-I/O
# rule.
serde_json = "1.0.151"
thiserror = "2.0.19"
