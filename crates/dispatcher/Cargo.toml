[package]
name = "relay-dispatcher"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"], default-features = false }
rand = "0.10.2"
relay-domain = { version = "0.1.0", path = "../domain" }
relay-metrics = { version = "0.1.0", path = "../metrics" }
relay-store = { version = "0.1.0", path = "../store" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = "1.24.0"

[dev-dependencies]
axum = "0.8.9"
# The tracing tests read the JSON a production deployment emits, not a
# test-only rendering of it: a span that is missing from the real output is
# exactly the bug being looked for.
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
relay-api = { path = "../api" }
relay-testkit = { path = "../testkit" }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
