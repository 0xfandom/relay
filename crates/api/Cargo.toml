[package]
name = "relay-api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
rand = "0.10.2"
relay-domain = { version = "0.1.0", path = "../domain" }
relay-store = { version = "0.1.0", path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.24.0"

[dev-dependencies]
# The concurrency test drives the real router over a real socket: 100 simultaneous
# requests through axum's own extractors is the only way to prove that losing the
# race never reaches the caller as a 5xx.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
