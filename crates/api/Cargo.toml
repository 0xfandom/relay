[package]
name = "relay-api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
rand = "0.10.2"
relay-store = { version = "0.1.0", path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.24.0"
